services:
  jarvis-thinker:
    image: voipmonitor/vllm:eldritch-enlightenment-v2226f26-b12x15cd38c-cu132-20260629

    entrypoint: ["/bin/bash", "-lc"]

    command:
      - |
        set -euo pipefail

        unset NCCL_GRAPH_FILE
        unset NCCL_GRAPH_DUMP_FILE
        unset VLLM_B12X_MLA_EXTEND_MAX_CHUNKS

        exec /opt/venv/bin/python -m vllm.entrypoints.cli.main serve /models/deepseek-ai/DeepSeek-V4-Flash-0731 \
          --served-model-name jarvis-thinker \
          --trust-remote-code \
          --host 0.0.0.0 \
          --port 8000 \
          --kv-cache-dtype fp8 \
          --block-size 256 \
          --load-format safetensors \
          --tensor-parallel-size 2 \
          --moe-backend b12x \
          --linear-backend b12x \
          --gpu-memory-utilization 0.95 \
          --max-model-len 1000000 \
          --max-num-seqs 8 \
          --async-scheduling \
          --no-scheduler-reserve-full-isl \
          --max-num-batched-tokens 4096 \
          --max-cudagraph-capture-size 192 \
          --attention-backend B12X_MLA_SPARSE \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}' \
          --tokenizer-mode deepseek_v4 \
          --tool-call-parser deepseek_v4 \
          --enable-auto-tool-choice \
          --reasoning-parser deepseek_v4 \
          --default-chat-template-kwargs.thinking=true \
          --default-chat-template-kwargs.reasoning_effort=high \
          --enable-flashinfer-autotune \
          --speculative-config '{"method":"dspark","num_speculative_tokens":5}'

    ports:
      - "10002:8000"

    volumes:
      - /media/mukul/data/models:/models
      - /home/mukul/llm/ds-flash/cache:/cache
      - /home/mukul/llm/ds-flash/root/.cache/huggingface:/root/.cache/huggingface
      - /home/mukul/llm/ds-flash/root/bench-results:/root/bench-results
      - /home/mukul/llm/ds-flash/root/vllm/artifacts:/root/vllm/artifacts

    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"

      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUTE_DSL_ARCH: sm_120a

      NCCL_IB_DISABLE: "1"
      NCCL_P2P_LEVEL: SYS
      NCCL_PROTO: LL,LL128,Simple

      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "4096"
      VLLM_USE_AOT_COMPILE: "1"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      VLLM_USE_MEGA_AOT_ARTIFACT: "1"
      VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"

      B12X_MHC_MAX_TOKENS: "16384"
      VLLM_USE_B12X_WO_PROJECTION: "1"
      VLLM_USE_B12X_MHC: "1"
      VLLM_USE_B12X_FP8_GEMM: "1"
      VLLM_USE_B12X_MOE: "1"
      VLLM_USE_B12X_SPARSE_INDEXER: "1"
      VLLM_PCIE_ALLREDUCE_BACKEND: b12x
      VLLM_ENABLE_PCIE_ALLREDUCE: "1"
      B12X_MLA_SM120_UNIFIED: "1"
      USES_B12X: "True"
      B12X_DENSE_SPLITK_TURBO: "1"
      B12X_W4A16_TC_DECODE: "1"

      # DSpark-specific knobs
      VLLM_DSPARK_CONFIDENCE_SCHEDULER: "off"
      VLLM_DSPARK_LOCAL_ARGMAX: "1"
      VLLM_DSPARK_REPLICATE_MARKOV_W1: "1"
      VLLM_DSPARK_FUSED_MARKOV_ARGMAX: "0"
      VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT: "0"
      VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE: "0"

    shm_size: "32g"
    ipc: host

    ulimits:
      memlock: -1
      stack: 67108864

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "2"]
              capabilities: [gpu]

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  jarvis-embed:
    image: vllm/vllm-openai-cpu:latest-x86_64

    command:
      - /models/ibm-granite/granite-embedding-311m-multilingual-r2
      - --served-model-name=jarvis-embed
      - --runner=pooling
      - --convert=embed
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=32768
      - --gpu-memory-utilization=0.05
      - --dtype=auto

    ports:
      - "10003:8000"

    volumes:
      - /media/mukul/data/models:/models:ro

    environment:
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "32"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  jarvis-gate:
    image: vllm/vllm-openai:latest

    command:
      - /models/cyankiwi/granite-4.1-3b-AWQ-INT4
      - --served-model-name=jarvis-gate
      - --trust-remote-code
      - --host=0.0.0.0
      - --port=8000
      - --dtype=auto
      - --kv-cache-dtype=fp8
      - --max-model-len=16384
      - --gpu-memory-utilization=0.06
      - --max-num-seqs=2
      - --max-num-batched-tokens=2048
      - --enable-prefix-caching

    ports:
      - "10009:8000"

    volumes:
      - /media/mukul/data/models:/models:ro

    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

    shm_size: "8g"
    ipc: host

    ulimits:
      memlock: -1
      stack: 67108864

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
